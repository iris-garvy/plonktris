# Fly.io config for the Plonktris API server.
#
# The app is host-agnostic: a single stateless Docker image that needs DATABASE_URL (any
# Postgres, e.g. a free Neon database with ?sslmode=require) and optionally ALLOWED_ORIGINS,
# and listens on $PORT. Any Docker host works (Fly, Render, Railway, Koyeb, Cloud Run, ...);
# this file is only used by `fly deploy`.
#
# Sized for ~zero cost: the smallest machine, stopped when idle and woken by the next request.

app = 'plonktris-server'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
