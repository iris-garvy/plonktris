[package]
name = "plonktris-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
# rustls instead of OpenSSL: managed Postgres (Neon etc.) requires TLS, and this keeps the
# Docker image free of libssl.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
argon2 = "0.5"
rustrict = "0.7"
